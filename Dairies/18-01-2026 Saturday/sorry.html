<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Na... 🥺</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Pacifico&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            90% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            padding: 20px;
        }

        /* Card styles */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: slideIn 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }

            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .gif-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }

        .sub-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        /* Button container */
        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-no {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-no:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
        }

        /* Hidden class */
        .hidden {
            display: none;
        }

        /* Thank you screen */
        .thankyou-screen {
            text-align: center;
        }

        .thankyou-screen .gif-container {
            width: 250px;
            height: 250px;
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .thankyou-message {
            font-family: 'Pacifico', cursive;
            font-size: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .thankyou-text {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f0f;
            position: absolute;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .card {
                padding: 40px 25px;
            }

            .message {
                font-size: 24px;
            }

            .btn {
                padding: 12px 30px;
                font-size: 16px;
            }

            .gif-container {
                width: 180px;
                height: 180px;
            }

            .thankyou-screen .gif-container {
                width: 220px;
                height: 220px;
            }

            .thankyou-message {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <!-- Floating hearts background -->
    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <!-- Screen 1: Initial request -->
        <div class="card" id="screen1">
            <div class="gif-container">
                <img src="beg-dont-leave.gif" alt="Please">
            </div>
            <div class="message">Maan jao please 🥺</div>
            <div class="sub-message">I'm really sorry...</div>
            <div class="button-container">
                <button class="btn btn-yes" onclick="acceptApology()">Yes ❤️</button>
                <button class="btn btn-no" onclick="showScreen2()">No 😔</button>
            </div>
        </div>

        <!-- Screen 2: Second attempt -->
        <div class="card hidden" id="screen2">
            <div class="gif-container">
                <img src="milk-and-mocha-bear-sorry-na.gif" alt="Please reconsider">
            </div>
            <div class="message">Ek baar aur sochlo 🥺</div>
            <div class="sub-message">Please yaar...</div>
            <div class="button-container">
                <button class="btn btn-yes" onclick="acceptApology()">Yes ❤️</button>
                <button class="btn btn-no" onclick="showScreen3()">No 😢</button>
            </div>
        </div>

        <!-- Screen 3: Final attempt -->
        <div class="card hidden" id="screen3">
            <div class="gif-container">
                <img src="sorry-na-sorry-jerry.gif" alt="Please think again">
            </div>
            <div class="message">Are aise kaise yrr socho to 🥹</div>
            <div class="sub-message">One more chance please...</div>
            <div class="button-container">
                <button class="btn btn-yes" onclick="acceptApology()">Yes ❤️</button>
                <button class="btn btn-no" id="movingNoBtn" onmouseover="moveButton()" onclick="moveButton()">No
                    💔</button>
            </div>
        </div>

        <!-- Thank you screen -->
        <div class="card hidden thankyou-screen" id="thankyouScreen">
            <div class="gif-container">
                <img src="cat-holding-flowers.jpg" alt="Thank you">
            </div>
            <div class="thankyou-message">Thank You! 💕</div>
            <div class="thankyou-text">
                I knew you'd understand! 🥰<br>
                You're the best! ❤️<br>
                Love you so much! 💖
            </div>
        </div>
    </div>

    <script>
        // Create floating hearts
        function createHearts() {
            const heartsBg = document.getElementById('heartsBg');
            const hearts = ['💜', '💗', '💖', '💕', '💝', '❤️', '🌸'];

            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 10 + 's';
                heart.style.animationDuration = (Math.random() * 5 + 8) + 's';
                heartsBg.appendChild(heart);
            }
        }

        // Show screen 2
        function showScreen2() {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.remove('hidden');
        }

        // Show screen 3
        function showScreen3() {
            document.getElementById('screen2').classList.add('hidden');
            document.getElementById('screen3').classList.remove('hidden');
        }

        // Accept apology - show thank you screen
        function acceptApology() {
            // Hide all screens
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.add('hidden');
            document.getElementById('screen3').classList.add('hidden');

            // Show thank you screen
            document.getElementById('thankyouScreen').classList.remove('hidden');

            // Create confetti effect
            createConfetti();
        }

        // Move the "No" button to a random position
        function moveButton() {
            const btn = document.getElementById('movingNoBtn');

            // Get viewport dimensions
            const maxX = window.innerWidth - 150; // button width approx
            const maxY = window.innerHeight - 60; // button height approx

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            // Apply absolute positioning
            btn.style.position = 'fixed';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
            btn.style.transition = 'all 0.3s ease';
            btn.style.zIndex = '1000';

            // Prevent default behavior
            return false;
        }

        // Create confetti effect
        function createConfetti() {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#ffd700', '#ff69b4'];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 50);
            }
        }

        // Initialize
        createHearts();
    </script>
</body>

</html>
